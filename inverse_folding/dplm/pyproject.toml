[project]
name = "byprot"
version = "1.0.0"
description = "A pytorch library for swift protein design research and developing."
authors = ["ByteDance Research <zhengzaixiang@bytedance.com>"]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchmetrics",
    "hydra-core==1.3.8",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.3.0",
    "tensorboard",
    "pyrootutils",
    "pre-commit",
    "black",
    "isort",
    "flake8",
    "nbstripout",
    "python-dotenv",
    "rich",
    "pytest",
    "sh",
    "pudb",
    "biopython==1.88.0",
    "biotite",
    "datasets==5.2.0",
    "deepspeed==0.20.0",
    "dm-tree",
    "e3nn",
    "einops",
    "debugpy",
    "fair-esm",
    "lmdb",
    "matplotlib",
    "mdtraj",
    "ml-collections",
    "modelcif",
    "opt-einsum",
    "pandas",
    "peft==0.22.0",
    "scikit-learn",
    "seaborn",
    "sympy",
    "tmtools",
    "transformers==5.24.0",
    "MDAnalysis",
]

[project.optional-dependencies]
pyg = [
    "torch-geometric",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
    "torch-spline-conv",
]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-cluster = ["torch"]
torch-sparse = ["torch"]
torch-spline-conv = ["torch"]
