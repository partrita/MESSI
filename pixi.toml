[workspace]
name = "messi"
version = "0.1.0"
description = "MESSI: protein deimmunization with discrete diffusion"
channels = ["conda-forge"]
platforms = [{ name = "linux-64-el8", platform = "linux-64", linux = "4.18" }]

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-options]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"

# Base Python dependencies used for Head inference, selection, and CPU metrics.
[pypi-dependencies]
numpy = "==2.4.2"
pandas = "==3.0.1"
pyarrow = "==23.0.0"
scipy = "==1.17.0"
PyYAML = "==6.0.3"
scikit-learn = "==1.8.0"
tqdm = "==4.67.3"
biopython = "==1.86"
matplotlib = "==3.10.8"
biotite = "==1.6.0"
tmtools = "==0.3.0"

[feature.cpu.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[feature.cpu.pypi-dependencies]
torch = "==2.7.1"

[feature.cuda.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[feature.cuda.pypi-dependencies]
torch = "==2.7.1"

# Generation / inverse-folding environment (extends base deps).
[feature.generation.pypi-dependencies]
pytorch-lightning = "==2.6.1"
lightning = "==2.6.1"
torchmetrics = "==1.9.0"
hydra-core = "==1.3.2"
omegaconf = "==2.3.0"
rich = "==14.3.2"
einops = "==0.8.2"
fair-esm = "==2.0.0"
transformers = "==4.44.2"
datasets = "==4.5.0"
lmdb = "==2.1.0"
dm-tree = "==0.1.9"
e3nn = "==0.6.0"
ml-collections = "==1.1.0"
modelcif = "==1.6"
mdtraj = "==1.11.1.post1"
MDAnalysis = "==2.10.0"
torch-geometric = "==2.7.0"

# torch-scatter wheels are hosted on PyG and must match the PyTorch build.
[feature.generation-cpu.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.7.0+cpu.html" }]

[feature.generation-cpu.pypi-dependencies]
torch = "==2.7.1"
torch-scatter = "*"

[feature.generation-cuda.pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.7.0+cu128.html" }]

[feature.generation-cuda.pypi-dependencies]
torch = "==2.7.1"
torch-scatter = "*"

[feature.test.pypi-dependencies]
pytest = "==9.0.2"

[tasks]
test = { cmd = "python -m pytest tests -q", env = { OMP_NUM_THREADS = "1" }, description = "Run CPU contract tests" }
check-generation-imports = { cmd = "python -c 'from inverse_folding.reference_flow.runtime import _load_byprot_imports; _load_byprot_imports()'", description = "Smoke-check generation runtime imports" }

[environments]
default = { features = ["cuda", "test"], solve-group = "cuda" }
cpu = { features = ["cpu", "test"], solve-group = "cpu" }
cuda = { features = ["cuda", "test"], solve-group = "cuda" }
generation-cpu = { features = ["generation", "generation-cpu"], solve-group = "generation-cpu" }
generation-cuda = { features = ["generation", "generation-cuda"], solve-group = "generation-cuda" }
