# Dependabot version updates for the uv-managed generation project.
# The repository itself is a Pixi workspace (pixi.toml/pixi.lock); the only
# manifest Dependabot can read here is inverse_folding/dplm (pyproject.toml +
# uv.lock), so updates are pointed there.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/inverse_folding/dplm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dplm-python:
        patterns: ["*"]
