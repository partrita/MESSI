name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: uv
      - uses: astral/setup-uv@v5
        with:
          uv-version: "0.4.x"
      - run: uv pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -r requirements.txt pytest==9.0.2
      - run: uv pip install -r requirements-generation.txt
      - run: uv pip install torch-scatter -f https://data.pyg.org/whl/torch-2.7.0+cpu.html
      - run: python -c 'from inverse_folding.reference_flow.runtime import _load_byprot_imports; _load_byprot_imports()'
