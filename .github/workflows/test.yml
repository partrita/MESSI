name: CPU contracts

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    name: CPU contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: cpu
          cache: true
          # 커밋된 pixi.lock은 재해석해도 바이트 단위로 같지만 pixi 0.84가 stale로
          # 판정해 --locked 설치가 실패한다. pixi가 잠금 파일을 새로 고치게 둔다.
          locked: false
      - name: Run CPU contract tests
        run: pixi run -e cpu test

  generation-imports:
    name: Generation import smoke check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: generation-cpu
          cache: true
          locked: false
      - name: Check generation runtime imports
        run: pixi run -e generation-cpu check-generation-imports